packages:
  # Dependencies
  - package: python-yattag # Dependency for chirp-next
  - package: airspyhf-git # Dependency for sdrpp-git and sdrpp-brown-git
  - package: libsdrplay # Dependency for sdrpp-git and sdrpp-brown-git
  - package: qt5-websockets # Dependency for wsjtx-improved and sdrangel-git
  - package: python-torchaudio # Dependency for freedv-gui
  - package: python-sounddevice # Dependency for freedata-server
  - package: hamradio-menus # Dependency for fldigi
  - package: cty # Dependency for fldigi
  - package: flxmlrpc # Dependency for fldigi
  - package: libmirisdr5-git # Dependency for sdrpp-mirisdr-source-git

  # Explicit Packages
  - package: paru # AUR Helper written in Rust
  - package: brave-bin # Brave Browser, Binary Version
  - package: tidal-hifi-bin # Tidal with Widevine support for HIFI Audio
  - package: discord-canary # Canary/Dev version of Discord
  - package: visual-studio-code-bin # Binary version of VS Code
  - package: pacvis-git # Visualizer of pacman packages
  - package: qdirstat # Disk usage utility
  - package: plasma-nano # Minimal KDE Plasma shell for Plasma Mobile
  - package: plasma-settings # KDE Plasma Mobile Settings
  - package: plasma-mobile-sounds # Sounds for Plasma Mobile
  - package: plasma-mobile # Plasma Mobile itself
    dependencies:
      - plasma-nano
      - plasma-settings
  - package: gsl-firmware-git # Silead Touchscreen Firmware for the silead kernel module
  - package: qdmr # Programming Software for DMR Radios
  - package: chirp-next # Programming Software for Analog Radios
    dependencies:
      - python-yattag
  - package: sdrpp-git # Software Defined Radio Front End - Stock Version
    dependencies:
      - airspyhf-git
      - libsdrplay
  - package: sdrpp-headers-git # Software Defined Radio Front End - Headers for Stock Version
    dependencies:
      - sdrpp-git
  - package: sdrpp-mirisdr-source-git
    dependencies:
      - sdrpp-git
      - sdrpp-headers-git
      - libmirisdr5-git
  - package: sdrpp-brown-git # Software Defined Radio Front End - Brown Version
    dependencies:
      - airspyhf-git
      - libsdrplay
  - package: wsjtx-improved # Tools for using JT9 and JT65 for Amateur Radio
    dependencies:
      - qt5-websockets
  - package: js8call # Tools for using JS8 for Amateur Radio
  - package: freedv-gui # Tools for using Digital Audio in HF for Amateur Radio
    dependencies:
      - python-torchaudio
  - package: freedata-server # Tools for HF Communication for Amateur Radio
    dependencies:
      - python-sounddevice
  - package: direwolf # TNC/APRS Software for Amateur Radio
  - package: graywolf-aprs # APRS radio transceiver, digipeater, and Internet gateway
  - package: fldigi # Digital tools for Amateur Radio
    dependencies:
      - cty
      - flxmlrpc
      - hamradio-menus
  - package: gridtracker2 # Multi Tool App for Amateur Radio
